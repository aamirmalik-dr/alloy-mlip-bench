[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alloybench"
version = "0.1.0"
description = "Deploy machine-learning interatomic potentials as ASE calculators and benchmark TiZrNb alloy properties: accuracy versus speed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aamir Malik" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "ase>=3.22",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
foundation = ["chgnet>=0.4", "mace-torch>=0.3"]
anchors = ["mp-api>=0.41"]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
alloybench = "alloybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Notebook plotting cells use compact semicolon chains on purpose.
"notebooks/*.ipynb" = ["E702", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
